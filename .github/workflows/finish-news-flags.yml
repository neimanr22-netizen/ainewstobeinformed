name: Finish news country flags
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-news-flags.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: finish-news-flags
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'neimanr22-netizen/ainewstobeinformed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified SVG assets and apply guarded style patch
        run: python tools/finish_news_flags.py
      - name: Commit only HTML and new flag assets
        run: |
          if [ -z "$(git status --porcelain -- index.html assets/news-flags)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/news-flags
          git commit -m 'Add remaining national flags, Nordic collage and CIS flag to news tiles'
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
