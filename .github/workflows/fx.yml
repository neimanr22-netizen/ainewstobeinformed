name: "Курсы валют: загрузка"
on:
  workflow_dispatch:
    inputs:
      start:
        description: "С даты (ГГГГ-ММ-ДД)"
        required: true
      end:
        description: "По дату (ГГГГ-ММ-ДД)"
        required: true
      pairs:
        description: "Пары через пробел"
        default: "USDRUB EURRUB EURUSD"
permissions:
  contents: write
concurrency: fx
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install curl_cffi requests
      - run: python tools/fx_fetch.py "${{ inputs.start }}" "${{ inputs.end }}" ${{ inputs.pairs }}
      - name: Сохранить
        if: always()
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add data/fx
          git diff --cached --quiet || (git commit -m "Курсы валют: ${{ inputs.start }} — ${{ inputs.end }}" && git push)
