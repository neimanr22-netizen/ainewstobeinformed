name: "Служебное: скачать страницы"
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Адреса через пробел"
        required: true
permissions:
  contents: write
concurrency: probe
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - env:
          URLS: ${{ inputs.urls }}
        run: |
          curl -sSL -o ru_root.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt || true
          curl -sSL -o ru_sub.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt || true
          cat /etc/ssl/certs/ca-certificates.crt ru_root.crt ru_sub.crt > $PWD/ca.pem
          export CURL_CA_BUNDLE=$PWD/ca.pem
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            code=$(curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -m 120 -o "f$i" -w "%{http_code} %{content_type} %{size_download}" "$u" 2>&1 || true)
            echo "f$i $code $u" | tee -a index.txt
          done
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe:probe-${{ github.run_id }}
