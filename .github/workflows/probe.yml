name: "Служебное: скачать страницы"
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Адреса через пробел"
        required: true
permissions:
  contents: write
concurrency: probe
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - env:
          URLS: ${{ inputs.urls }}
        run: |
          curl -sSL -o ru_root.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt || true
          curl -sSL -o ru_sub.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt || true
          head -c 80 ru_root.crt; echo
          cp /etc/ssl/certs/ca-certificates.crt ca.pem
          for f in ru_root.crt ru_sub.crt; do grep -q "BEGIN CERTIFICATE" $f && { echo >> ca.pem; cat $f >> ca.pem; echo >> ca.pem; }; done
          export CA=$PWD/ca.pem
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            REF=$(echo "$u" | sed -E 's#^(https?://[^/]+/).*#\1#')
            code=$(curl -sSL --cacert "$CA" -b cj.txt -c cj.txt -e "$REF" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -m 120 -o "f$i" -w "%{http_code} %{content_type} %{size_download}" "$u" 2>&1 || true)
            echo "f$i $code $u" | tee -a index.txt; sleep 2
          done
          pip install -q pandas openpyxl xlrd >/dev/null 2>&1 || true
          for f in f*; do
            t=$(file -b "$f")
            case "$t" in
              *RAR*|*Zip*|*7-zip*) mkdir -p "x_$f" && 7z x -y -o"x_$f" "$f" >/dev/null || true ;;
            esac
          done
          python3 - <<'PY' || true
          import os, pandas as pd
          for root, _, files in os.walk('.'):
              for fn in files:
                  p = os.path.join(root, fn)
                  if '.git' in p: continue
                  low = fn.lower()
                  head = open(p, 'rb').read(8)
                  if low.endswith(('.xls', '.xlsx')) or head.startswith(b'PK\x03\x04') and not low.endswith('.zip') or head.startswith(b'\xd0\xcf\x11\xe0'):
                      try:
                          xs = pd.read_excel(p, sheet_name=None, header=None)
                      except Exception as e:
                          continue
                      for sh, df in xs.items():
                          df.to_csv(p + '__' + str(sh).replace('/', '_')[:40] + '.csv', index=False, header=False)
          PY
          find . -size +40M -delete
          rm -f cj.txt
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe:probe-${{ github.run_id }}
