name: "Notino: проверка доступа"
on:
  workflow_dispatch:
    inputs:
      urls: {description: "URL через пробел", default: ""}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install curl_cffi playwright && sudo apt-get install -y xvfb >/dev/null
      - run: xvfb-run -a python tools/notino_probe.py ${{ inputs.urls }}
      - name: Сохранить в ветку
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe-bot@users.noreply.github.com
          git checkout -b notino-probe-${{ github.run_id }}
          mkdir -p probe && cp -r out/* probe/ 2>/dev/null || true
          git add probe && git commit -qm probe && git push -q origin HEAD || true
