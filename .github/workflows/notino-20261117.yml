name: Notino fresh snapshot 2026-11-17
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notino-20261117.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notino-20261117
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        country: [de, at, ch, cz, sk, hu, pl, si, hr, ro, bg, it, es, pt, fr, be, nl, gr, ie, uk, dk, se, fi, lt, lv, ee]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - name: Check observation date and protect existing snapshot
        run: |
          test "$(TZ=Europe/Moscow date +%F)" = '2026-11-17'
          test ! -e data/prices/notino/2026-11-17.json
      - name: Collect live Notino prices
        run: python tools/notino_fetch.py 2026-11-17 ${{ matrix.country }}
      - name: Check collection completed on requested date
        run: test "$(TZ=Europe/Moscow date +%F)" = '2026-11-17'
      - uses: actions/upload-artifact@v4
        with:
          name: notino-2026-11-17-${{ matrix.country }}
          path: data/prices/notino/2026-11-17.json
          if-no-files-found: error
          retention-days: 7
  save:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - uses: actions/download-artifact@v4
        with:
          pattern: notino-2026-11-17-*
          path: notino-snapshots
      - name: Validate, merge and preserve older dates
        run: python tools/merge_notino_20261117.py
      - name: Save only the new date and date index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/prices/notino/2026-11-17.json data/prices/notino/2026-11-17.csv data/prices/notino/2026-11-17.quality.json data/prices/notino/manifest.json
          git diff --cached --exit-code -- data/prices/notino/2026-11-16.json data/prices/notino/2026-11-16.csv
          git commit -m 'Add fresh Notino country-price snapshot for 2026-11-17; preserve 2026-11-16'
          git push origin HEAD:main
      - name: Request site publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Verify published Notino date index
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "https://ainewstobeinformed.ru/data/prices/notino/manifest.json?check=$(date +%s)" | python -c 'import json,sys; m=json.load(sys.stdin); assert any(d["date"]=="2026-11-17" and d["items"]>0 for d in m["dates"])'; then
              echo '17 November is available in the published Notino date index.'
              exit 0
            fi
            sleep 10
          done
          echo 'Data committed, but site publication was not verified.'
          exit 1
