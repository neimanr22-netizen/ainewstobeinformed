name: "Цены: сбор в магазинах"
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти магазины (например: cz/teta hu/rossmann), пусто = все"
        default: ""
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install curl_cffi requests
      - name: Сбор
        run: |
          DAY=$(TZ=Europe/Moscow date +%F)
          python tools/prices_fetch.py "$DAY" ${{ inputs.only }}
          python tools/prices_build.py "$DAY"
      - name: Сохранить
        if: always()
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add data/prices
          git diff --cached --quiet || (git commit -m "Цены: $(TZ=Europe/Moscow date +%F)" && git pull --rebase && git push)
