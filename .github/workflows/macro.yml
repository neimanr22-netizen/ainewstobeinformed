name: "Макроэкономика: загрузка"
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Отладка одной функции (ph, ...)"
        default: ""
permissions:
  contents: write
concurrency: macro
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl
      - run: python tools/macro_fetch.py ${{ inputs.debug && format('--debug {0}', inputs.debug) || '' }}
      - name: Сохранить
        if: always()
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/macro
          git diff --cached --quiet || (git commit -m "Макроэкономика: обновление данных" && git pull --rebase && git push)
