const PAGES = [
  {id:'world', name:'Мир', title:'Главные новости мира', lead:'20 событий, которые определяли мировую повестку 1–13 ноября 2026.'},
  {id:'russia', name:'Россия', title:'Главные новости России', lead:'20 событий: экономика, безопасность, законы и общество.'},
  {id:'politics', name:'Политика стран', title:'Политика стран', lead:'По 5 ключевых политических новостей для каждой страны.'}
];
const COUNTRY_IDS = {"Россия":"ru","США":"us","ЕС":"eu","Германия":"de","Австрия":"at","Швейцария":"ch","Чехия":"cz","Словакия":"sk","Венгрия":"hu"};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function list(items){
  return '<ol class="news">'+items.map(n=>`<li><h3>${esc(n.t)}</h3><div class="meta">Дата публикации: ${esc(n.d)}</div><p>${esc(n.s)}</p><div class="src">Источник: <a href="${n.u}" target="_blank" rel="noopener">${esc(host(n.u))}</a></div></li>`).join('')+'</ol>';
}

const tabsEl = document.getElementById('mainTabs');
const app = document.getElementById('app');
PAGES.forEach(p=>{
  const b=document.createElement('button'); b.className='tab'; b.textContent=p.name; b.dataset.id=p.id;
  b.onclick=()=>{location.hash=p.id;}; tabsEl.appendChild(b);
  const sec=document.createElement('section'); sec.className='page'; sec.id='page-'+p.id;
  let html=`<h2>${p.title}</h2><p class="lead">${p.lead}</p>`;
  if(p.id==='politics'){
    html+='<div class="subtabs">'+Object.keys(DATA.politics).map(c=>`<button class="subtab" data-c="${COUNTRY_IDS[c]}">${c}</button>`).join('')+'</div>';
    html+=Object.entries(DATA.politics).map(([c,items])=>`<div class="country" data-c="${COUNTRY_IDS[c]}" style="display:none"><h2>${c}</h2>${list(items)}</div>`).join('');
  } else { html+=list(DATA[p.id]); }
  sec.innerHTML=html; app.appendChild(sec);
});
document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{location.hash='politics-'+b.dataset.c;});

function route(){
  let h=(location.hash||'').slice(1)||'world';
  let page=h, country=null;
  if(h.startsWith('politics')){page='politics'; country=h.split('-')[1]||'ru';}
  if(!PAGES.some(p=>p.id===page)) page='world';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===page));
  document.querySelectorAll('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+page));
  if(page==='politics'){
    if(!Object.values(COUNTRY_IDS).includes(country)) country='ru';
    document.querySelectorAll('.subtab').forEach(t=>t.classList.toggle('active',t.dataset.c===country));
    document.querySelectorAll('.country').forEach(d=>d.style.display=d.dataset.c===country?'block':'none');
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
