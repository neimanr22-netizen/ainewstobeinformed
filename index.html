<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI News — быть в курсе</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --muted:#6b6862; --line:#e4e0d6;
    --accent:#b4441f; --accent-soft:#f6e3da; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#161614;--card:#211f1c;--ink:#ece8e0;--muted:#9a958b;--line:#35322d;--accent:#e2774f;--accent-soft:#3a271f;--shadow:none}
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{max-width:920px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-weight:800;letter-spacing:-.02em;font-size:19px;text-decoration:none;color:var(--ink)}
  .logo span{color:var(--accent)}
  .period{margin-left:auto;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
  .period button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 12px;cursor:pointer}
  main{max-width:920px;margin:0 auto;padding:22px 18px 60px}
  .crumbs{font-size:14px;color:var(--muted);margin-bottom:6px}
  .crumbs a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
  h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
  /* period picker */
  .picker{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-width:560px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row label{flex:1 1 200px;font-size:14px;color:var(--muted)}
  input[type=date],input[type=search]{display:block;width:100%;margin-top:6px;font:inherit;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .go{width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
  .hint{font-size:13px;color:var(--muted);margin-top:12px}
  /* tiles */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .tile{display:flex;flex-direction:column;justify-content:space-between;min-height:104px;padding:18px;border-radius:14px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent)}
  .tile b{font-size:19px;line-height:1.25}
  .tile small{color:var(--muted);font-size:14px;margin-top:10px}
  .tile .n{display:inline-block;min-width:26px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px;font-weight:700;font-size:13px}
  .tile.empty{opacity:.5}
  .note{font-size:14px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:-8px 0 20px}
  /* news */
  .tools{display:flex;gap:10px;margin-bottom:16px}
  .tools input{margin:0}
  .day{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
  .news{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .item h3{margin:0 0 6px;font-size:18px;line-height:1.3}
  .item p{margin:0 0 10px}
  .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .empty-msg{padding:30px;text-align:center;color:var(--muted);background:var(--card);border-radius:14px;border:1px solid var(--line)}
  .loading{color:var(--muted)}
  /* search */
  .search{margin:0 0 20px;max-width:560px}
  .search input{margin:0}
  .found{font-size:14px;color:var(--muted);margin:0 0 4px}
  .found b{color:var(--ink)}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
  .tag{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px}
  footer{max-width:920px;margin:0 auto;padding:0 18px 40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">AI&nbsp;News<span>.</span></a>
  <div class="period" id="periodBox"></div>
</div></header>
<main id="app"><p class="loading">Загрузка…</p></main>
<footer id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let CFG = null, MANIFEST = null;
const dayCache = {};

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.toISOString().slice(0,10);
const parse = s => new Date(s + 'T00:00:00Z');
const human = s => { const d = parse(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const humanDay = s => { const d = parse(s); return `${WD[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const rangeText = (a,b) => a === b ? human(a) : `${human(a)} — ${human(b)}`;
function plural(n, one, few, many){ const m10=n%10, m100=n%100;
  return m10===1&&m100!==11 ? one : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? few : many); }
const newsWord = n => `${n} ${plural(n,'новость','новости','новостей')}`;

const norm = s => String(s ?? '').toLowerCase().replace(/ё/g,'е');
const wordsOf = q => norm(q).split(/\s+/).filter(Boolean);
const matches = (i, words) => { const t = norm(i.title+' '+i.summary+' '+i.source); return words.every(w => t.includes(w)); };
function hl(text, words){
  if (!words.length) return esc(text);
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')).join('|') + ')', 'giu');
  return String(text ?? '').split(re).map((part,k) => k % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}
function tagOf(i){
  const c = catById(i.cat); if (!c) return '';
  const s = subsOf(c).find(x => x.id === i.sub);
  return esc(c.name + (s ? ' › ' + s.name : ''));
}
/* список новостей, сгруппированный по дням */
function newsHtml(list, words=[], showTag=false){
  list = [...list].sort((a,b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
  let html = '', cur = null;
  list.forEach(i => {
    if (i.date !== cur){ if (cur) html += '</ul>'; cur = i.date; html += `<div class="day">${humanDay(i.date)}</div><ul class="news">`; }
    html += `<li class="item"><h3>${hl(i.title, words)}</h3><p>${hl(i.summary, words)}</p>
      <div class="meta"><span>${human(i.date)}</span>${showTag ? `<span class="tag">${tagOf(i)}</span>` : ''}<a href="${esc(i.url)}" target="_blank" rel="noopener">${hl(i.source, words)} ↗</a></div></li>`;
  });
  return html + (cur ? '</ul>' : '');
}
/* поле поиска; ищет только среди getItems() — то есть внутри текущего этапа */
function searchBlock(placeholder){
  return `<div class="search"><input type="search" id="q" placeholder="${esc(placeholder)}" autocomplete="off"></div><div id="results" hidden></div>`;
}
function bindSearch(getItems, {showTag=true, browse='#browse', initial=''} = {}){
  const input = $('#q'), res = $('#results'), br = $(browse);
  let pending = null, seq = 0;
  const run = async () => {
    const q = input.value, words = wordsOf(q), my = ++seq;
    const hs = location.hash.split('?'), qs = new URLSearchParams(hs[1] || '');
    q.trim() ? qs.set('q', q.trim()) : qs.delete('q');
    history.replaceState(null, '', (hs[0] || '#/') + (qs.toString() ? '?' + qs : ''));
    if (!words.length){ res.hidden = true; res.innerHTML = ''; if (br) br.hidden = false; return; }
    if (br) br.hidden = true; res.hidden = false;
    if (!pending){ res.innerHTML = '<p class="loading">Ищу…</p>'; pending = Promise.resolve(getItems()); }
    const items = await pending; if (my !== seq) return;
    const found = items.filter(i => matches(i, words));
    res.innerHTML = found.length
      ? `<p class="found">Найдено: <b>${newsWord(found.length)}</b></p>` + newsHtml(found, words, showTag)
      : '<div class="empty-msg">Ничего не найдено.</div>';
  };
  input.oninput = run;
  if (initial){ input.value = initial; run(); }
}

function catById(id){ return CFG.categories.find(c => c.id === id); }
function subsOf(cat){ return cat.subs === 'countries' ? CFG.countries : (cat.subs || []); }

async function loadBase(){
  const v = Date.now();
  [CFG, MANIFEST] = await Promise.all([
    fetch('data/categories.json?v='+v).then(r=>r.json()),
    fetch('data/manifest.json?v='+v).then(r=>r.json()).catch(()=>({days:{}}))
  ]);
  const days = Object.keys(MANIFEST.days);
  const total = Object.values(MANIFEST.days).reduce((a,b)=>a+b,0);
  if (days.length) $('#foot').textContent =
    `В архиве ${newsWord(total)} с ${human(days[0])} по ${human(days[days.length-1])}. Даты — по публикации в источнике.`;
}

async function loadRange(from, to){
  const days = Object.keys(MANIFEST.days).filter(d => d >= from && d <= to);
  const v = MANIFEST.updated || '';
  await Promise.all(days.filter(d => !dayCache[d]).map(d =>
    fetch(`data/days/${d}.json?v=${encodeURIComponent(v)}`).then(r=>r.json()).then(j => dayCache[d]=j)));
  return days.flatMap(d => dayCache[d] || []);
}

function setPeriodBox(from, to){
  const box = $('#periodBox');
  if (!from){ box.innerHTML=''; return; }
  box.innerHTML = `<span>${esc(rangeText(from,to))}</span><button id="chg">Изменить</button>`;
  $('#chg').onclick = () => location.hash = `#/?from=${from}&to=${to}`;
}

/* ---------- экран 1: выбор периода ---------- */
function viewPicker(q){
  setPeriodBox();
  const days = Object.keys(MANIFEST.days);
  const last = days.length ? days[days.length-1] : iso(new Date());
  const first = days.length ? days[0] : last;
  const from = q.get('from') || (() => { const d = parse(last); d.setUTCDate(d.getUTCDate()-6); const s = iso(d); return s < first ? first : s; })();
  const to = q.get('to') || last;
  const today = iso(new Date());
  app.innerHTML = `
    <h1>Выберите период</h1>
    <p class="sub">Новости показываются по дате публикации в источнике.</p>
    ${days.length ? searchBlock('Поиск по всему архиву…') : ''}
    <div class="picker" id="browse">
      <div class="row">
        <label>С даты<input type="date" id="from" value="${from}" max="${today}"></label>
        <label>По дату<input type="date" id="to" value="${to}" max="${today}"></label>
      </div>
      <div class="presets">
        <button class="chip" data-d="0">Последний день</button>
        <button class="chip" data-d="6">Последние 7 дней</button>
        <button class="chip" data-d="13">Последние 14 дней</button>
        <button class="chip" data-m="1">Этот месяц</button>
        <button class="chip" data-all="1">Весь архив</button>
      </div>
      <button class="go" id="go">Показать новости</button>
      <div class="hint">${days.length ? `Новости есть с ${human(first)} по ${human(last)}.` : 'Архив пока пуст.'}</div>
    </div>`;
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    let a, z = last;
    if (b.dataset.all){ a = first; }
    else if (b.dataset.m){ a = last.slice(0,8)+'01'; }
    else { const d = parse(last); d.setUTCDate(d.getUTCDate() - +b.dataset.d); a = iso(d); }
    $('#from').value = a; $('#to').value = z;
  });
  $('#go').onclick = () => {
    let a = $('#from').value, z = $('#to').value;
    if (!a || !z) return;
    if (a > z) [a, z] = [z, a];
    location.hash = `#/p/${a}/${z}`;
  };
  if (days.length) bindSearch(() => loadRange(first, last), {initial: q.get('q') || ''});
}

/* ---------- экран 2: категории ---------- */
async function viewCategories(from, to, q){
  setPeriodBox(from, to);
  app.innerHTML = '<p class="loading">Загрузка…</p>';
  const items = await loadRange(from, to);
  const cnt = {}; items.forEach(i => cnt[i.cat] = (cnt[i.cat]||0) + 1);
  app.innerHTML = `
    <h1>Категории</h1>
    <p class="sub">${esc(rangeText(from,to))} · ${newsWord(items.length)}</p>
    ${searchBlock('Поиск по всем категориям за период…')}
    <div class="grid" id="browse">${CFG.categories.map(c => {
      const n = cnt[c.id] || 0, s = subsOf(c).length;
      return `<a class="tile ${n?'':'empty'}" href="#/p/${from}/${to}/${c.id}">
        <b>${esc(c.name)}</b>
        <small><span class="n">${n}</span> ${s ? '· ' + s + ' ' + plural(s,'подкатегория','подкатегории','подкатегорий') : ''}</small></a>`;
    }).join('')}</div>`;
  bindSearch(() => items, {initial: q.get('q') || ''});
}

/* ---------- экран 3: подкатегории ---------- */
async function viewSubs(from, to, cat, q){
  setPeriodBox(from, to);
  const items = (await loadRange(from, to)).filter(i => i.cat === cat.id);
  const cnt = {}; items.forEach(i => cnt[i.sub] = (cnt[i.sub]||0) + 1);
  app.innerHTML = `
    <div class="crumbs"><a href="#/p/${from}/${to}">Категории</a></div>
    <h1>${esc(cat.name)}</h1>
    <p class="sub">${esc(rangeText(from,to))} · ${newsWord(items.length)}</p>
    ${cat.note ? `<div class="note">${esc(cat.note)}</div>` : ''}
    ${searchBlock(`Поиск в категории «${cat.name}»…`)}
    <div class="grid" id="browse">${subsOf(cat).map(s => {
      const n = cnt[s.id] || 0;
      return `<a class="tile ${n?'':'empty'}" href="#/p/${from}/${to}/${cat.id}/${s.id}"><b>${esc(s.name)}</b><small><span class="n">${n}</span></small></a>`;
    }).join('')}</div>`;
  bindSearch(() => items, {initial: q.get('q') || ''});
}

/* ---------- экран 4: новости ---------- */
async function viewNews(from, to, cat, sub, q){
  setPeriodBox(from, to);
  const all = (await loadRange(from, to)).filter(i => i.cat === cat.id && (!sub || i.sub === sub.id));
  const crumbs = `<a href="#/p/${from}/${to}">Категории</a>` +
    (sub ? ` / <a href="#/p/${from}/${to}/${cat.id}">${esc(cat.name)}</a>` : '');
  const name = sub ? sub.name : cat.name;
  app.innerHTML = `
    <div class="crumbs">${crumbs}</div>
    <h1>${esc(name)}</h1>
    <p class="sub">${esc(rangeText(from,to))} · ${newsWord(all.length)}</p>
    ${!sub && cat.note ? `<div class="note">${esc(cat.note)}</div>` : ''}
    ${all.length ? searchBlock(`Поиск в «${name}»…`) : ''}
    <div id="browse">${all.length ? newsHtml(all) : '<div class="empty-msg">За этот период новостей нет.</div>'}</div>`;
  if (all.length) bindSearch(() => all, {showTag: false, initial: q.get('q') || ''});
}

/* ---------- роутер ---------- */
async function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = new URLSearchParams(qs || '');
  const p = path.split('/').filter(Boolean);
  window.scrollTo(0,0);
  if (p[0] !== 'p' || !/^\d{4}-\d{2}-\d{2}$/.test(p[1]||'') || !/^\d{4}-\d{2}-\d{2}$/.test(p[2]||'')) return viewPicker(q);
  const [, from, to, catId, subId] = p;
  if (!catId) return viewCategories(from, to, q);
  const cat = catById(catId);
  if (!cat) return viewCategories(from, to, q);
  const subs = subsOf(cat);
  if (!subs.length) return viewNews(from, to, cat, null, q);
  const sub = subs.find(s => s.id === subId);
  return sub ? viewNews(from, to, cat, sub, q) : viewSubs(from, to, cat, q);
}

loadBase().then(() => { window.addEventListener('hashchange', route); route(); })
  .catch(e => app.innerHTML = `<div class="empty-msg">Не удалось загрузить данные: ${esc(e.message)}</div>`);
</script>
</body>
</html>
